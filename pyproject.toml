[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.1.0"
description = "CSC10014 Smart Virtual Assistant Project — Team 03"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.3.3",
    "rich>=13.9.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]