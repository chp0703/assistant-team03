
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Assistant - Chat</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #243047;
    }

    .container {
      max-width: 760px;
      margin: 50px auto;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 { color: #294eb4; }

    .chat-box {
      background: white;
      border: 1px solid #dce2ee;
      border-radius: 16px;
      padding: 24px;
      min-height: 350px;
      box-shadow: 0 5px 18px #0000000a;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .assistant {
      background: #edf1ff;
      margin-right: auto;
    }

    .user {
      background: #294eb4;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #cfd6e4;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      padding: 14px 22px;
      background: #294eb4;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .note {
      text-align: center;
      color: #667085;
      font-size: 13px;
      margin-top: 18px;
    }

    @media (max-width: 600px) {
      .container { margin: 15px auto; padding: 12px; }
      .chat-box { padding: 16px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>Study Assistant</h1>
      <p>Virtual HCMUS university assistant</p>
    </header>

    <main class="chat-box">
      <div class="message assistant">
        Hello! How can I help you today?
      </div>

      <div class="message user">
        Where is the training office?
      </div>

      <div class="message assistant">
        This is a sample assistant response.
        Real backend integration will be added later.
      </div>
    </main>

    <div class="input-area">
      <input
        type="text"
        placeholder="Type your question here..."
        aria-label="Your question"
        disabled
      >
      <button type="button" disabled>Send</button>
    </div>

    <p class="note">
      UI Prototype - Lab 02 | Team 03
      <br>
      Backend connection is not implemented yet
    </p>
  </div>
</body>
</html>
